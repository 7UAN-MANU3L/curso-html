<!-- Primer ejemplo de formulario -->
<!DOCTYPE html>
<html lang="es">
<head>
    <title>Primer formulario</title>
</head>
<body>
    <h1>Formulario de Registro</h1>
    <form>
        <label for="nombre">Nombre:</label>
        <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Escribe tu nombre"
            required>
        <br><br>

        <label for="correo">Correo electrónico</label>
        <input
            type="email"
            id="correo"
            name="correo"
            placeholder="ejemplo@gmail.com"
            required>
        <br><br>

        <label for="edad">Edad:</label>
        <input
            type="number"
            id="edad"
            name="edad"
            min="1"
            max="100"
            required>
        <br><br>

        <label for="password">Contraseña:</label>
        <input 
            type="password"
            id="password"
            name="password"
            placeholder="********"
            required>
        <br><br>

        <button type="submit">Registrarse</button>

    </form>
</body>
</html>
